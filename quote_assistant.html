<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Assistant - Pricing Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            height: 80vh;
            max-height: 700px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px 12px 0 0;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            gap: 10px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 14px;
            word-wrap: break-word;
        }

        .user .message-content {
            background: #667eea;
            color: white;
            border-radius: 12px 0 12px 12px;
        }

        .assistant .message-content {
            background: #f0f0f0;
            color: #333;
            border-radius: 0 12px 12px 12px;
        }

        .loading {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
        }

        .loading-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #667eea;
            animation: bounce 1.4s infinite;
        }

        .loading-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                opacity: 0.3;
                transform: translateY(0);
            }
            40% {
                opacity: 1;
                transform: translateY(-10px);
            }
        }

        .input-area {
            padding: 20px;
            border-top: 1px solid #eee;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 24px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-area input:focus {
            border-color: #667eea;
        }

        .input-area button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .input-area button:hover {
            transform: scale(1.05);
        }

        .input-area button:active {
            transform: scale(0.95);
        }

        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .price-recommendation {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 16px;
            border-radius: 8px;
            margin-top: 10px;
            line-height: 1.6;
        }

        .price-recommendation strong {
            color: #667eea;
            display: block;
            margin-top: 8px;
            margin-bottom: 4px;
        }

        .price-recommendation strong:first-child {
            margin-top: 0;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 12px 16px;
            border-radius: 8px;
            border-left: 4px solid #c33;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 Quote Assistant</h1>
            <p>AI-powered pricing recommendations</p>
        </div>

        <div class="chat-box" id="chatBox"></div>

        <div class="input-area">
            <input
                type="text"
                id="customerInput"
                placeholder="Describe the customer (e.g., enterprise SaaS, fintech, 2000 seats)..."
                onkeypress="handleKeyPress(event)"
            />
            <button onclick="sendRequest()">Get Quote</button>
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";
        const chatBox = document.getElementById("chatBox");
        const customerInput = document.getElementById("customerInput");

        function addMessage(text, isUser = false) {
            const messageDiv = document.createElement("div");
            messageDiv.className = `message ${isUser ? "user" : "assistant"}`;
            
            const contentDiv = document.createElement("div");
            contentDiv.className = "message-content";
            contentDiv.innerHTML = text;
            
            messageDiv.appendChild(contentDiv);
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function addLoading() {
            const messageDiv = document.createElement("div");
            messageDiv.className = "message assistant";
            messageDiv.id = "loadingMessage";
            
            const loadingDiv = document.createElement("div");
            loadingDiv.className = "loading";
            loadingDiv.innerHTML = `
                <div class="loading-dot"></div>
                <div class="loading-dot"></div>
                <div class="loading-dot"></div>
            `;
            
            messageDiv.appendChild(loadingDiv);
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function removeLoading() {
            const loadingMessage = document.getElementById("loadingMessage");
            if (loadingMessage) {
                loadingMessage.remove();
            }
        }

        async function sendRequest() {
            const description = customerInput.value.trim();
            
            if (!description) {
                alert("Please enter a customer description");
                return;
            }

            // Add user message to chat
            addMessage(description, true);
            customerInput.value = "";
            
            // Show loading indicator
            addLoading();
            
            // Disable button
            document.querySelector("button").disabled = true;

            try {
                // Call the backend API
                const response = await fetch(`${API_URL}/analyze-customer`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ description: description })
                });

                removeLoading();

                if (!response.ok) {
                    throw new Error(`API error: ${response.statusCode}`);
                }

                const data = await response.json();

                // Format the response
                let responseText = `<strong>📊 Analysis Results:</strong><div class="price-recommendation">`;
                responseText += `<strong>Segment:</strong> ${data.segment}<br>`;
                responseText += `<strong>Industry:</strong> ${data.industry}<br>`;
                responseText += `<strong>Estimated Seats:</strong> ${data.seats}<br>`;
                responseText += `<strong>Modules:</strong> ${data.modules.length > 0 ? data.modules.join(", ") : "None specified"}<br>`;
                responseText += `<strong>Confidence:</strong> ${(data.confidence * 100).toFixed(0)}%<br><br>`;

                // Add comparable deals info
                if (data.comparable_deals && data.comparable_deals.total > 0) {
                    responseText += `<strong>📈 Comparable Market Data:</strong><br>`;
                    responseText += `• Total Deals Analyzed: ${data.comparable_deals.total}<br>`;
                    responseText += `• Average Price: $${data.comparable_deals.average_price.toLocaleString('en-US')}<br>`;
                    responseText += `• Price Range: ${data.comparable_deals.price_range}<br><br>`;
                } else {
                    responseText += `<strong>📈 Market Data:</strong> No comparable deals available yet<br><br>`;
                }

                // Add price recommendation
                if (data.price_recommendation) {
                    responseText += `<strong>💡 AI Recommendation:</strong><br>`;
                    responseText += `${data.price_recommendation}<br><br>`;
                }

                // Add price range
                if (data.price_range) {
                    responseText += `<strong>💰 Suggested Price Range:</strong><br>`;
                    responseText += `• Low: $${data.price_range.low.toLocaleString('en-US')}<br>`;
                    responseText += `• <span style="color: #667eea; font-weight: bold;">Recommended: $${data.price_range.recommended.toLocaleString('en-US')}</span><br>`;
                    responseText += `• High: $${data.price_range.high.toLocaleString('en-US')}`;
                }

                responseText += `</div>`;

                addMessage(responseText, false);

            } catch (error) {
                removeLoading();
                addMessage(`<div class="error">❌ Error: ${error.message}</div>`, false);
            } finally {
                document.querySelector("button").disabled = false;
                customerInput.focus();
            }
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendRequest();
            }
        }

        // Initial message
        addMessage("Hi! 👋 I'm your Quote Assistant. Describe your customer and I'll recommend a price based on comparable deals from your database.", false);
    </script>
</body>
</html>
